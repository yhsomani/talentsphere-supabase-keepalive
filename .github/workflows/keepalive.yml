name: Supabase keep-alive

on:
  schedule:
    # Monday and Thursday 06:00 UTC; scheduled runs may be delayed.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests (no network or Supabase secrets)
        run: python3 -m unittest discover -s tests -v

  ping:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run database-backed read-only ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEEPALIVE_RPC: keepalive_ping
        run: python3 scripts/keepalive.py
