name: Diagnose Supabase auth (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Try request variants
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          say() { echo "::warning title=diag::$(printf '%s' "$*" | tr '\n' ' ' | cut -c1-900)"; }
          say "URL length ${#URL}; KEY length ${#KEY}; KEY starts with '${KEY:0:15}'"
          say "URL whitespace count: $(printf '%s' "$URL" | grep -o '[[:space:]]' | wc -l); KEY whitespace count: $(printf '%s' "$KEY" | grep -o '[[:space:]]' | wc -l)"
          say "URL is: $URL"
          for variant in apikey-only bearer-only both; do
            case $variant in
              apikey-only) H=(-H "apikey: $KEY");;
              bearer-only) H=(-H "Authorization: Bearer $KEY");;
              both) H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY");;
            esac
            code=$(curl -sS -m 20 -o /tmp/body.txt -w "%{http_code}" "${H[@]}" "$URL/rest/v1/" 2>&1)
            say "$variant: HTTP $code. body: $(head -c 300 /tmp/body.txt)"
          done
          code=$(curl -sS -m 20 -o /tmp/body.txt -w "%{http_code}" -H "apikey: $KEY" "$URL/rest/v1/keepalive_probe_missing?select=*&limit=1")
          say "rest table probe (publishable key): HTTP $code. body: $(head -c 300 /tmp/body.txt)"
          say "auth/v1/health without key: HTTP $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$URL/auth/v1/health")"
          say "auth/v1/health with key: HTTP $(curl -sS -m 20 -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/auth/v1/health")"
