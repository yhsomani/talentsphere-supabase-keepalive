name: Supabase keep-alive watchdog

on:
  schedule:
    # Independent monitor, twice daily (UTC), offset from keepalive schedule.
    - cron: "43 3,15 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-recent-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fail when no successful ping occurred within 18 hours
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_MAX_AGE_HOURS: "18"
        run: python3 scripts/watchdog.py

  report:
    name: Report missing ping and recovery
    if: ${{ always() && needs.verify-recent-ping.result != 'skipped' }}
    needs: [verify-recent-ping]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHECK_RESULT: ${{ needs.verify-recent-ping.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or resolve missed-ping issue
        shell: bash
        run: |
          set -euo pipefail
          title="Supabase keep-alive missing successful ping"
          number="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '.[] | select(.title == "Supabase keep-alive missing successful ping") | .number' | head -n 1)"
          if [[ "$CHECK_RESULT" == "success" ]]; then
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$GH_REPO" --body "Database ping verification recovered: $RUN_URL"
              gh issue close "$number" --repo "$GH_REPO" --reason completed
            fi
          else
            body="No verified successful Supabase database ping within the configured watchdog threshold. Check $RUN_URL and the keepalive workflow."
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$GH_REPO" --body "$body"
            else
              gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
            fi
          fi
